<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copy My Gesture</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#10152b,#202b55);color:#fff;display:flex;justify-content:center;align-items:center;padding:24px}.app{width:min(1050px,100%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}header{text-align:center}h1{margin:0 0 8px;font-size:clamp(30px,5vw,48px)}.sub{margin:0;color:#cbd2f5}.game{display:grid;grid-template-columns:1fr 1.35fr;gap:24px;margin-top:25px}.card{background:rgba(0,0,0,.18);border-radius:18px;padding:22px}.target{text-align:center}.target-emoji{font-size:110px;min-height:130px;display:flex;align-items:center;justify-content:center}.target-name{font-size:25px;font-weight:bold}.camera{position:relative;overflow:hidden;border-radius:16px;background:#05070e;aspect-ratio:4/3}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.status{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.72);padding:10px 12px;border-radius:10px;text-align:center}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:bold;cursor:pointer;background:#fff;color:#111}button.primary{background:#7c8cff;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.stats{display:flex;justify-content:space-around;text-align:center;margin-top:18px}.stat b{display:block;font-size:28px}.stat span{color:#cbd2f5;font-size:13px}.result{text-align:center;min-height:48px;margin-top:15px;font-size:20px;font-weight:bold}.ok{color:#7dffb2}.bad{color:#ff9b9b}.hint{color:#cbd2f5;font-size:13px;line-height:1.5;margin-top:16px}@media(max-width:750px){.game{grid-template-columns:1fr}.app{padding:18px}}
</style>
</head>
<body>
<div class="app">
<header><h1>🖐️ Copy My Gesture</h1><p class="sub">Look at the target, copy it with your hand, and beat the clock.</p></header>
<div class="game">
<section class="card target">
<div>YOUR TARGET</div><div id="targetEmoji" class="target-emoji">✋</div><div id="targetName" class="target-name">Open Palm</div>
<div id="timer">Ready?</div>
<div class="controls"><button id="startBtn" class="primary">Start Game</button><button id="nextBtn" disabled>Next Gesture</button></div>
<div class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="round">0</b><span>ROUND</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></div>
</section>
<section class="card">
<div class="camera"><video id="video" autoplay playsinline muted></video><div id="status" class="status">Press Start Game to enable the camera.</div></div>
<div id="result" class="result"></div>
<p class="hint">Supported: ✊ Fist · ✋ Palm · ☝️ Pointing Up · ✌️ Victory · 👍 Thumbs Up · 👎 Thumbs Down · 🤟 I Love You.</p>
</section>
</div></div>

<script type="module">
import {GestureRecognizer, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.mjs";

const $=id=>document.getElementById(id);
const video=$("video"), startBtn=$("startBtn"), nextBtn=$("nextBtn"), statusEl=$("status"),
resultEl=$("result"), targetEmoji=$("targetEmoji"), targetName=$("targetName"),
timerEl=$("timer"), scoreEl=$("score"), roundEl=$("round"), bestEl=$("best");

const gestures=[
{name:"Closed Fist",emoji:"✊",api:"Closed_Fist"},
{name:"Open Palm",emoji:"✋",api:"Open_Palm"},
{name:"Pointing Up",emoji:"☝️",api:"Pointing_Up"},
{name:"Victory",emoji:"✌️",api:"Victory"},
{name:"Thumbs Up",emoji:"👍",api:"Thumb_Up"},
{name:"Thumbs Down",emoji:"👎",api:"Thumb_Down"},
{name:"I Love You",emoji:"🤟",api:"ILove_You"}
];

let recognizer=null,stream=null,running=false,round=0,score=0,best=Number(localStorage.getItem("gestureBest")||0);
let target=null,deadline=0,locked=false,lastVideoTime=-1;
bestEl.textContent=best;

async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia) throw new Error("Camera API unavailable. Use HTTPS or localhost.");
  statusEl.textContent="Requesting camera permission…";
  stream=await navigator.mediaDevices.getUserMedia({
    video:{width:{ideal:640},height:{ideal:480},facingMode:"user"},
    audio:false
  });
  video.srcObject=stream;
  await video.play();
  statusEl.textContent="📷 Camera is on. Loading hand recognition…";
}

async function loadRecognizer(){
  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
  );
  const options={
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
      delegate:"CPU"
    },
    runningMode:"VIDEO",
    numHands:1
  };
  recognizer=await GestureRecognizer.createFromOptions(vision,options);
}

function chooseTarget(){
  target=gestures[Math.floor(Math.random()*gestures.length)];
  targetEmoji.textContent=target.emoji; targetName.textContent=target.name;
  resultEl.textContent=""; resultEl.className="result"; locked=false;
  deadline=performance.now()+6000; nextBtn.disabled=true;
}
function beginRound(){round++;roundEl.textContent=round;chooseTarget();}
function finish(ok,detected){
  if(locked)return;locked=true;
  if(ok){score++;scoreEl.textContent=score;resultEl.textContent=`🎉 Perfect! You copied ${target.name}.`;resultEl.className="result ok";}
  else{resultEl.textContent=detected?`❌ Detected ${detected}. Target was ${target.name}.`:`⏰ Time's up! Target was ${target.name}.`;resultEl.className="result bad";}
  if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("gestureBest",best)}
  nextBtn.disabled=false;
}
function loop(){
  if(!running)return;
  const now=performance.now();
  if(recognizer && video.readyState>=2 && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    try{
      const res=recognizer.recognizeForVideo(video,now);
      const top=res.gestures?.[0]?.[0];
      if(top && top.score>=0.55 && !locked){
        const detected=gestures.find(g=>g.api===top.categoryName);
        if(detected){
          statusEl.textContent=`I see: ${detected.emoji} ${detected.name} (${Math.round(top.score*100)}%)`;
          if(detected.api===target.api)finish(true,detected.name);
        }
      }
    }catch(e){console.warn(e)}
  }
  if(!locked){
    const remaining=Math.max(0,(deadline-now)/1000);
    timerEl.textContent=`${remaining.toFixed(1)} seconds`;
    if(remaining<=0)finish(false);
  }
  requestAnimationFrame(loop);
}

startBtn.onclick=async()=>{
  startBtn.disabled=true;
  try{
    // Start the camera FIRST. This makes camera permission independent of model loading.
    await startCamera();
    statusEl.textContent="📷 Camera is on. Loading hand recognition…";
    await loadRecognizer();
    running=true;score=0;round=0;scoreEl.textContent="0";roundEl.textContent="0";
    statusEl.textContent="Show the target gesture to the camera.";
    beginRound();loop();
  }catch(err){
    console.error(err);
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    let msg=err.name==="NotAllowedError"?"Camera permission was blocked. Click the 🔒 icon in the address bar → Camera → Allow, then reload."
      :err.name==="NotFoundError"?"No camera was found on this device."
      :err.name==="NotReadableError"?"The camera is busy in another app. Close Zoom/Teams/Camera and try again."
      :`Could not start: ${err.message||err}`;
    statusEl.textContent="❌ "+msg;
    startBtn.disabled=false;
  }
};
nextBtn.onclick=()=>{if(running)beginRound()};
window.addEventListener("beforeunload",()=>stream?.getTracks().forEach(t=>t.stop()));
</script>
</body>
</html>
